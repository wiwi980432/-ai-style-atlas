<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#21132e"><title>AI 顏值圖鑑</title><style>*{box-sizing:border-box}body{margin:0;background:#120e1e;color:#f8f1ff;font-family:system-ui,-apple-system,sans-serif}header{padding:22px 20px;background:#251731;position:sticky;top:0;z-index:2}h1{font-size:23px;margin:0}small,p{color:#cbbbd4}main{max-width:620px;margin:auto;padding:18px 16px 90px}.panel{background:#251b34;border:1px solid #4e385e;border-radius:22px;padding:20px;margin-bottom:17px}h2{font-size:19px;margin:0 0 12px}.upload{display:block;text-align:center;border:2px dashed #b66fa9;border-radius:16px;padding:22px;cursor:pointer}input[type=file]{display:none}#preview{max-width:100%;max-height:260px;border-radius:12px;display:none;margin:12px auto}.chips{display:flex;gap:9px;flex-wrap:wrap}.chip{background:#392b4a;border:1px solid #70567b;color:white;border-radius:99px;padding:11px 14px;font-size:14px;cursor:pointer}.chip.on{background:#c54f96;border-color:#e88bc0}button{cursor:pointer}button.primary{border:0;border-radius:14px;background:#e55da4;color:#fff;font-weight:700;padding:15px;width:100%;font-size:16px;margin-top:16px}.person{display:flex;gap:14px;align-items:center;border-bottom:1px solid #49364f;padding:13px 0}.avatar{width:64px;height:76px;display:grid;place-items:center;background:linear-gradient(145deg,#a65c9d,#473869);border-radius:14px;font-size:28px;flex-shrink:0}.meta{flex:1}.meta b{display:block}.meta small{display:block;margin-top:5px}.heart{background:transparent;color:#f3a5cb;border:1px solid #795d83;border-radius:12px;padding:10px;font-size:18px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#251731;border-top:1px solid #553e60;justify-content:space-around;padding:12px}nav button{background:none;color:#f2d7eb;border:0;font-size:14px}section[hidden]{display:none}#status{color:#f6a4cd;font-size:14px;margin-top:10px}</style></head><body><header><h1>✦ AI 顏值圖鑑</h1><small>探索你的理想造型風格 · 手機互動版</small></header><main><section id="match"><div class="panel"><h2>① 上傳照片（選用）</h2><label class="upload">📷 點選上傳照片<input id="file" type="file" accept="image/*"><img id="preview" alt="照片預覽"><small>照片僅於本機預覽，不上傳伺服器</small></label></div><div class="panel"><h2>② 選擇你喜歡的風格</h2><p>這是手動風格標籤推薦，不進行人臉辨識。</p><div class="chips" id="chips"></div><button class="primary" id="go">探索風格推薦</button><div id="status"></div></div><div class="panel"><h2>推薦結果</h2><div id="results"><p>選擇風格後按「探索風格推薦」。</p></div></div></section><section id="atlas" hidden><div class="panel"><h2>人物圖鑑</h2><p>以下均為虛構的成年示範人物，不代表真實演員。</p><div id="all"></div></div></section><section id="saved" hidden><div class="panel"><h2>我的收藏</h2><div id="faves"></div></div></section></main><nav><button data-page="match">✨ 風格配對</button><button data-page="atlas">▦ 人物圖鑑</button><button data-page="saved">♡ 我的收藏</button></nav><script>const tags=['甜美','清新','成熟','優雅','可愛','知性','短髮','長髮','自然妝','精緻妝','活潑','冷豔'];const people=[['星野美月',['甜美','可愛','長髮','自然妝']],['佐藤莉奈',['清新','知性','短髮','自然妝']],['白石優香',['成熟','優雅','長髮','精緻妝']],['藤原千夏',['活潑','可愛','短髮','甜美']],['高橋凜',['冷豔','知性','長髮','精緻妝']],['小川真央',['清新','優雅','自然妝','長髮']]];let selected=new Set(),favs=new Set(JSON.parse(localStorage.getItem('atlas-favs')||'[]'));const el=id=>document.getElementById(id);function renderChips(){el('chips').innerHTML=tags.map(t=>'<button class="chip '+(selected.has(t)?'on':'')+'" data-tag="'+t+'">'+t+'</button>').join('');document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{selected.has(b.dataset.tag)?selected.delete(b.dataset.tag):selected.add(b.dataset.tag);renderChips()})}function card(p,score){let i=people.indexOf(p),name=p[0];return '<div class="person"><div class="avatar">✿</div><div class="meta"><b>'+name+' · 18+</b><small>'+p[1].join(' · ')+'</small>'+(score!==undefined?'<small>風格標籤吻合：'+score+' 項</small>':'')+'</div><button class="heart" data-fav="'+i+'">'+(favs.has(i)?'♥':'♡')+'</button></div>'}function wire(){document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{let i=+b.dataset.fav;favs.has(i)?favs.delete(i):favs.add(i);localStorage.setItem('atlas-favs',JSON.stringify([...favs]));renderAll()})}function renderAll(){el('all').innerHTML=people.map(p=>card(p)).join('');el('faves').innerHTML=[...favs].map(i=>card(people[i])).join('')||'<p>尚無收藏</p>';if(selected.size){let ranked=people.map(p=>({p,n:p[1].filter(t=>selected.has(t)).length})).sort((a,b)=>b.n-a.n);el('results').innerHTML=ranked.slice(0,5).map(x=>card(x.p,x.n)).join('')}wire()}el('go').onclick=()=>{if(!selected.size){el('status').textContent='請先選擇至少一個風格標籤';return}el('status').textContent='已根據風格標籤排序（非照片 AI 分析）';renderAll();el('results').scrollIntoView({behavior:'smooth',block:'nearest'})};el('file').onchange=e=>{let f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return;let reader=new FileReader();reader.onload=()=>{el('preview').src=reader.result;el('preview').style.display='block'};reader.readAsDataURL(f)};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{['match','atlas','saved'].forEach(id=>el(id).hidden=id!==b.dataset.page);renderAll();window.scrollTo(0,0)});renderChips();renderAll();</script></body></html>
